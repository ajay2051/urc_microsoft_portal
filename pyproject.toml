[project]
name = "urc-assignment"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "celery>=5.7.0",
    "django>=6.1.3",
    "django-bolt>=0.13.0",
    "django-redis>=7.0.0",
    "djangorestframework>=3.18.3",
    "psycopg2-binary>=2.9.13",
    "pyjwt[crypto]>=2.15.1",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
    "redis>=8.1.0",
    "ruff>=0.17.4",
]

[dependency-groups]
dev = [
    "pytest-django>=4.14.0",
]

[tool.ruff]
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501", "B008"]  # B008: Depends() defaults are the framework idiom

[tool.ruff.lint.per-file-ignores]
"project/settings_test.py" = ["E402", "F403", "F405"]
"project/api.py" = ["E402"]
