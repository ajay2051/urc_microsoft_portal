name: ci-cd

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MODE: development
      DJANGO_SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789abcdef
      DATABASE_NAME: urc
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: ci
      DATABASE_HOST: localhost
      DATABASE_PORT: "5432"
      ENTRA_TENANT_ID: 11111111-1111-1111-1111-111111111111
      ENTRA_API_CLIENT_ID: 22222222-2222-2222-2222-222222222222
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync
      - name: Lint
        run: uv run ruff check .
      - name: Migrations are up to date
        run: uv run python manage.py makemigrations --check --dry-run
      - name: Tests
        run: uv run pytest
      - name: Dependency audit
        run: uvx pip-audit -r requirements.txt

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          pull: true
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image for vulnerabilities
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:latest
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  deploy:
    needs: image
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production        # add required reviewers in GitHub settings for manual approval
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/client-ops
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f